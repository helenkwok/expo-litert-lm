plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.helenkwok.offlineaid'
version = '1.0.0'

android {
  namespace "expo.modules.litertlm"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.google.mediapipe:tasks-genai:0.10.27'
  // 0.11.0 (2026-05-07) adds Gemma 4 Multi-Token Prediction (MTP) support — >2x decode
  // speedup on GPU when ExperimentalFlags.enableSpeculativeDecoding is set before Engine
  // init. See ExpoLitertLmModule.kt where the flag is toggled.
  implementation 'com.google.ai.edge.litertlm:litertlm-android:0.11.0'
}
