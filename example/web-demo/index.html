<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>expo-litert-lm — Web smoke test (@litert-lm/core v0.12.0)</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    .sub { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .row { margin: 0.75rem 0; }
    label { display: inline-block; min-width: 120px; }
    input[type="text"] { width: 380px; max-width: 100%; padding: 0.4rem; font-family: monospace; }
    button { padding: 0.5rem 1rem; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #peak { font-size: 2rem; font-weight: 700; color: #003366; margin: 0.5rem 0; }
    #meta { color: #444; font-size: 0.9rem; }
    #output { background: #f5f5f5; padding: 1rem; border-radius: 8px; margin-top: 1rem; font-family: Menlo, monospace; font-size: 0.85rem; white-space: pre-wrap; min-height: 100px; }
    .warn { background: #fff3cd; border: 1px solid #ffe69c; padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }
    .err { color: #cc0000; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>expo-litert-lm — Web smoke test</h1>
  <p class="sub">@litert-lm/core v0.12.0 · WebGPU + CPU</p>

  <div id="caps" class="warn">Checking environment&hellip;</div>

  <div class="row">
    <label for="modelFile">Model file:</label>
    <input id="modelFile" type="file" accept=".litertlm,application/octet-stream" />
  </div>
  <div id="modelMeta" class="sub" style="margin: -0.25rem 0 0.75rem 120px;">(pick a .litertlm — Gemma 4 E2B or Gemma 3 1B INT4 from your filesystem)</div>
  <div class="row">
    <label for="backend">Backend:</label>
    <select id="backend">
      <option value="gpu">GPU (WebGPU)</option>
      <option value="cpu">CPU</option>
    </select>
  </div>
  <div class="row">
    <label for="prompt">Prompt:</label>
    <input id="prompt" type="text" value="Summarize in two sentences: stay calm, find shelter, call emergency services if safe, follow local instructions, and check on neighbors when conditions allow." />
  </div>

  <div class="row">
    <button id="run" disabled>Load &amp; Run</button>
    <button id="cancel" disabled>Cancel</button>
  </div>

  <div id="peak">peak — MB</div>
  <div id="meta">backend — · ttft — · — tok/s</div>

  <div id="output"></div>
  <div id="error" class="err"></div>

  <script type="module">
    import { Engine, Backend } from 'https://cdn.jsdelivr.net/npm/@litert-lm/core@0.12.0/+esm';

    const $ = (id) => document.getElementById(id);
    const capsEl = $('caps');
    const runBtn = $('run');
    const cancelBtn = $('cancel');
    const peakEl = $('peak');
    const metaEl = $('meta');
    const outEl = $('output');
    const errEl = $('error');

    // Environment check — matches isLiteRtAvailable() in our web shim.
    const hasGpu = 'gpu' in navigator;
    const isCOI = self.crossOriginIsolated === true;
    if (!hasGpu) {
      capsEl.innerHTML = '<strong>No WebGPU</strong> — your browser does not expose <code>navigator.gpu</code>. Chrome / Edge 113+ on supported GPUs, Safari 18+, or Firefox Nightly with WebGPU enabled.';
    } else if (!isCOI) {
      capsEl.innerHTML = '<strong>Not cross-origin isolated</strong> — page must be served with COOP/COEP headers so SharedArrayBuffer is available (the WASM runtime needs threading). See <code>README.md</code> &rarr; Web setup.';
    } else {
      capsEl.innerHTML = 'WebGPU + crossOriginIsolated &check; — environment looks good. Pick a .litertlm model below.';
      capsEl.style.background = '#d4edda';
      capsEl.style.borderColor = '#9fd4ad';
    }

    // Enable Run only after a file is picked AND the environment is good.
    let pickedFile = null;
    const fileInput = $('modelFile');
    const modelMeta = $('modelMeta');
    fileInput.addEventListener('change', () => {
      pickedFile = fileInput.files?.[0] ?? null;
      if (pickedFile) {
        const mb = (pickedFile.size / 1024 / 1024).toFixed(1);
        modelMeta.textContent = `${pickedFile.name} · ${mb} MB`;
        runBtn.disabled = !(hasGpu && isCOI);
      } else {
        modelMeta.textContent = '(pick a .litertlm — Gemma 4 E2B or Gemma 3 1B INT4 from your filesystem)';
        runBtn.disabled = true;
      }
    });

    let activeConversation = null;
    let activeEngine = null;

    cancelBtn.onclick = () => {
      try { activeConversation?.cancel(); } catch (e) { /* no-op */ }
    };

    let peakMb = 0;
    const samplePerf = () => {
      const mb = (performance?.memory?.usedJSHeapSize ?? 0) / 1024 / 1024;
      if (mb > peakMb) peakMb = mb;
      peakEl.textContent = `peak ${peakMb.toFixed(1)} MB`;
    };

    runBtn.onclick = async () => {
      if (!pickedFile) {
        errEl.textContent = 'Pick a .litertlm file first.';
        return;
      }
      runBtn.disabled = true;
      cancelBtn.disabled = false;
      outEl.textContent = '';
      errEl.textContent = '';
      peakMb = 0;
      const backend = $('backend').value === 'cpu' ? Backend.CPU : Backend.GPU;
      const prompt = $('prompt').value;
      const pollHandle = setInterval(samplePerf, 250);
      let firstTokenAt = null;
      let tokenCount = 0;
      try {
        // Clean up any prior run.
        if (activeConversation) { try { await activeConversation.delete(); } catch {} activeConversation = null; }
        if (activeEngine) { try { await activeEngine.delete(); } catch {} activeEngine = null; }
        metaEl.textContent = 'loading model…';
        // File.stream() returns a ReadableStream<Uint8Array>, which is one of
        // the accepted shapes for EngineSettings.model. No URL / network /
        // CORS / COOP-CORP coordination needed — the bytes come straight from
        // the user's filesystem via the picker.
        activeEngine = await Engine.create({ model: pickedFile.stream(), backend });
        activeConversation = await activeEngine.createConversation();
        const tAfterLoad = performance.now();
        const stream = activeConversation.sendMessageStreaming(prompt);
        const reader = stream.getReader();
        try {
          while (true) {
            const { value: chunk, done } = await reader.read();
            if (done) break;
            const delta = (chunk?.content ?? [])
              .filter((c) => c.type === 'text' && typeof c.text === 'string')
              .map((c) => c.text)
              .join('');
            if (delta) {
              if (firstTokenAt === null) firstTokenAt = performance.now();
              tokenCount++;
              outEl.textContent += delta;
            }
          }
        } finally {
          reader.releaseLock();
        }
        const tEnd = performance.now();
        const ttftMs = firstTokenAt ? Math.round(firstTokenAt - tAfterLoad) : null;
        const decodeMs = firstTokenAt ? tEnd - firstTokenAt : null;
        const tokPerSec = decodeMs && tokenCount > 1 ? (tokenCount / (decodeMs / 1000)) : null;
        metaEl.textContent = `backend ${$('backend').value.toUpperCase()}` +
          (ttftMs !== null ? ` · ttft ${ttftMs} ms` : '') +
          (tokPerSec !== null ? ` · ${tokPerSec.toFixed(1)} tok/s` : '');
      } catch (e) {
        errEl.textContent = e?.message ?? String(e);
      } finally {
        clearInterval(pollHandle);
        samplePerf();
        runBtn.disabled = false;
        cancelBtn.disabled = true;
      }
    };
  </script>
</body>
</html>
